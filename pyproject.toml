[project]
name = "mojo-metpy"
version = "0.1.0"
description = "MetPy's meteorological calculations implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "meteorology", "metpy", "thermodynamics", "performance"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "metpy", "pandas", "scipy"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-metpy"
Repository = "https://github.com/lee101/mojo-metpy"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
