[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-metpy"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = { cmd = "bash build/build.sh", description = "Compile src/capi.mojo to dist/libmojo-metpy.so" }
test = { cmd = "python -m pytest tests -q", description = "Parity tests against MetPy plus behaviour tests" }
bench = { cmd = "flock /tmp/mojo-bench.lock python bench/bench.py", description = "Markdown benchmark table vs MetPy and NumPy" }

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092905"
max = "==26.7.0.dev2026092905"
python = "3.13.*"
pytest = "*"
numpy = "*"
metpy = "*"
pandas = "*"
scipy = "*"
